name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaopuy
          POSTGRES_PASSWORD: xiaopuy
          POSTGRES_DB: xiaopuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaopuy -d xiaopuy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate test database
        env:
          PGPASSWORD: xiaopuy
        run: psql -h 127.0.0.1 -U xiaopuy -d xiaopuy_test -f migrations/001_initial.sql

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://xiaopuy:xiaopuy@127.0.0.1:5432/xiaopuy_test?sslmode=disable
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
